<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dafzik Blockchain Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .block-card { 
            background: #1e293b; border-left: 5px solid #3b82f6; 
            transition: transform 0.3s; margin-bottom: 15px;
        }
        .block-card:hover { transform: scale(1.02); }
        .hash-font { font-family: 'Courier New', Courier, monospace; font-size: 0.85em; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">🚀 Dafzik<span class="text-primary">Node</span></h1>
            <div id="status" class="badge bg-success p-2">Server Terhubung</div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card bg-dark border-secondary p-3 mb-4">
                    <h5 class="text-white">Tambah Blok Baru</h5>
                    <input type="text" id="symbol" class="form-control mb-2" placeholder="Nama Koin (ex: BTC)">
                    <input type="number" id="price" class="form-control mb-2" placeholder="Harga">
                    <button onclick="mineBlock()" class="btn btn-primary w-100">Mulai Menambang ⛏️</button>
                </div>
            </div>

            <div class="col-md-8">
                <h5 class="mb-3">Daftar Rantai Blok (Ledger)</h5>
                <div id="chain-container">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Fungsi untuk ambil data dari Backend (GET)
        async function updateDashboard() {
            try {
                const response = await fetch('http://localhost:5000/blocks');
                const chain = await response.json();
                const container = document.getElementById('chain-container');
                
                // Tampilkan dari yang terbaru (reverse)
                container.innerHTML = chain.reverse().map(block => `
                    <div class="card block-card p-3">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold text-info">Blok #${block.index}</span>
                            <small class="text-muted">${block.timestamp}</small>
                        </div>
                        <div class="my-2">
                            <strong>Data:</strong> ${block.data.symbol} | <strong>Price:</strong> $${block.data.price}
                        </div>
                        <div class="hash-font">Hash: ${block.hash}</div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('status').className = "badge bg-danger p-2";
                document.getElementById('status').innerText = "Server Mati";
            }
        }

        // 2. Fungsi untuk nambang dari tombol (POST)
        async function mineBlock() {
            const symbol = document.getElementById('symbol').value;
            const price = document.getElementById('price').value;

            await fetch('http://localhost:5000/mine', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol, price })
            });

            alert("Mining sukses!");
            updateDashboard(); // Refresh tampilan
        }

        // Jalankan update setiap 3 detik
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
