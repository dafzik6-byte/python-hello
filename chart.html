<!DOCTYPE html>
<html>
<head>
    <title>Bitcoin Simple Chart</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <h2 style="font-family: sans-serif;">Bitcoin (BTC/USD) - Latihan Chart</h2>
    <div id="chart-container"></div>

    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
            width: 800,
            height: 400,
            layout: { backgroundColor: '#ffffff', textColor: '#333' },
            grid: { vertLines: { color: '#f0f3fa' }, horzLines: { color: '#f0f3fa' } },
        });

        const lineSeries = chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });

        // Data Contoh (Waktu & Harga)
        lineSeries.setData([
            { time: '2026-02-01', value: 95000 },
            { time: '2026-02-02', value: 97000 },
            { time: '2026-02-03', value: 96000 },
            { time: '2026-02-04', value: 98500 },
            { time: '2026-02-05', value: 101000 },
            { time: '2026-02-06', value: 103000 },
        ]);
    </script>
</body>
</html>
