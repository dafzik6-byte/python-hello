<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whale Hunter Pro + Analysis Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="left-panel">
        <div class="panel-header">
            <div id="coin-name" style="color: var(--yellow); font-weight: bold;">BTC / USDT</div>
            <div id="live-price" class="live-price-big">$0.00</div>
            <div id="price-change" style="font-size: 13px;">0.00%</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-label">Market Cap (Live)</div>
            <div class="stat-value" id="live-mkt-cap">$ --</div>
            <div class="stat-label">Vol 24h (Sync)</div>
            <div class="stat-value" id="live-vol-24h" style="color: var(--yellow);">$ --</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Trades Count</div>
            <div id="live-count-24h" class="stat-value" style="color: #00d2ff;">0</div>
            <div class="stat-label">Circ. Supply</div>
            <div id="disp-circ" class="stat-value" style="font-size: 12px; color: var(--gray);">--</div>
        </div>

        <div class="season-container">
            <div class="stat-label">Market Season Index</div>
            <div id="season-text" style="font-size: 14px; font-weight: 800; color: #fff;">ANALYZING...</div>
            <div class="season-bar-bg">
                <div id="season-progress"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--gray); margin-top: 5px;">
                <span>BTC SEASON</span>
                <span>ALT SEASON</span>
            </div>
        </div>

        <div id="listing-panel">
            <div class="stat-label" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span>Upcoming Listings</span>
                <button onclick="addCoinPrompt()" style="background: var(--line); border: none; color: var(--yellow); cursor: pointer; border-radius: 3px; font-size: 9px; padding: 2px 6px;">+ ADD</button>
            </div>
            <div id="watchlist-container"></div>
        </div>

        <div class="fg-panel-bottom">
            <div class="stat-label" style="margin-bottom: 10px;">Market Sentiment</div>
            <div class="gauge-container">
                <div class="gauge-base">
                    <div class="gauge-arc" id="fg-arc"></div>
                    <div class="gauge-center">
                        <div id="fg-value-display">--</div>
                        <div id="fg-status-text">LOADING</div>
                    </div>
                </div>
                <div class="gauge-needle" id="fg-needle"></div>
            </div>
        </div>
    </div>

    <div id="chart-zone">
        <div id="tv_engine" style="height: 70% !important;"></div>
        
        <div id="analysis-bottom-zone" style="height: 30%; display: flex; flex-direction: column; background: #12161c; border-top: 2px solid var(--line); overflow: hidden;">
            <div id="narrative-header" style="padding: 10px 15px; background: #181a20; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line);">
                <span style="color: var(--yellow); font-weight: bold; font-size: 11px; letter-spacing: 1px;">LIVE NARRATIVE SECTOR PERFORMANCE</span>
                <span id="last-update-narrative" style="font-size: 9px; color: var(--gray);">SYNCING...</span>
            </div>
            
            <div id="narrative-scroll-container" style="flex: 1; overflow-y: auto; padding: 15px;">
                <div id="narrative-grid">
                    </div>
            </div>
        </div>
    </div>

    <div id="aggr-sidebar">
        <div class="panel-control">
            <input type="text" id="coin-search" placeholder="Search (e.g. SOLUSDT)...">
            <div class="limit-box">
                <label>WHALE LIMIT ($)</label>
                <input type="number" id="whale-input" value="50000">
            </div>
            <div id="search-results"></div>
        </div>
        
        <div id="trade-feed"></div>
        
        <div class="volume-monitor">
            <button id="mute-btn" title="Toggle Sound">🔊</button>
            <div style="font-size: 10px; color: var(--gray); text-align: center; margin-bottom: 5px;">MOMENTUM ALERT (50 TRADES)</div>
            <div class="vol-bar-container">
                <div id="buy-bar" style="width: 50%; background: var(--up); transition: 0.5s;"></div>
                <div id="sell-bar" style="width: 50%; background: var(--down); transition: 0.5s;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold;">
                <span id="buy-pct" style="color: var(--up)">50%</span>
                <span id="sell-pct" style="color: var(--down)">50%</span>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="chart.js"></script>
</body>
</html>
