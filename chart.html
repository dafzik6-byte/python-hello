<!DOCTYPE html>
<html>
<head>
    <title>Pro Trading Terminal - BTC</title>
    <style>
        /* Paksa body dan html ambil 100% tinggi layar */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background-color: #131722; 
            overflow: hidden; /* Hilangkan scrollbar luar */
        }

        /* Container widget harus memenuhi sisa layar */
        .tradingview-widget-container { 
            height: 100%; 
            width: 100%; 
        }

        #tradingview_pro {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="tradingview-widget-container">
        <div id="tradingview_pro"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
        new TradingView.widget(
        {
            "autosize": true, // Ini akan mengikuti ukuran container-nya
            "symbol": "BINANCE:BTCUSDT",
            "interval": "1",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true,
            "show_popup_button": true,
            "popup_width": "1000",
            "popup_height": "650",
            "container_id": "tradingview_pro"
        }
        );
        </script>
    </div>

</body>
</html>
