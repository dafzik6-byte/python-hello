<!DOCTYPE html>
<html>
<head>
    <title>Bitcoin Candlestick Fix</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; background-color: #131722; font-family: sans-serif; }
        #chart-container { width: 100%; height: 500px; }
        h2 { color: white; padding: 20px; }
    </style>
</head>
<body>
    <h2>BTC/USD Candlestick (Fixed)</h2>
    <div id="chart-container"></div>

    <script>
// 1. Tambahkan opsi untuk memperlebar batang (barSpacing)
const chartOptions = { 
    layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
    width: window.innerWidth,
    height: 500,
    timeScale: {
        barSpacing: 60,      // Semakin besar angka ini, semakin lebar batangnya
        rightOffset: 10,     // Memberi sedikit ruang di sisi kanan
    },
};

const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);

const candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350', 
    borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
});

const data = [
    { time: '2026-02-01', open: 95000, high: 97000, low: 94000, close: 96500 },
    { time: '2026-02-02', open: 96500, high: 99000, low: 96000, close: 98000 },
    { time: '2026-02-03', open: 98000, high: 101000, low: 97500, close: 100500 },
    { time: '2026-02-04', open: 100500, high: 100800, low: 92000, close: 94000 },
    { time: '2026-02-05', open: 94000, high: 98000, low: 93500, close: 97500 },
    { time: '2026-02-06', open: 97500, high: 105000, low: 97000, close: 104500 }
];

candleSeries.setData(data);

// 2. Ini yang memaksa semua data terlihat memenuhi area yang tersedia
chart.timeScale().fitContent();

// Simulasi pergerakan harga pada candle terakhir
setInterval(() => {
    const lastData = data[data.length - 1];
    
    // Memberikan variasi harga acak sekitar +/- 100
    const change = (Math.random() - 0.5) * 200;
    const newClose = lastData.close + change;
    
    // Update data candle terakhir
    candleSeries.update({
        time: lastData.time,
        open: lastData.open,
        high: Math.max(lastData.high, newClose),
        low: Math.min(lastData.low, newClose),
        close: newClose
    });
}, 1000);
    </script>
</body>
</html>
