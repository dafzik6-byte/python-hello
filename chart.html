<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Whale Hunter Pro + Analysis Tools</title>
    <style>
        :root { --bg: #0b0e11; --line: #2b2f36; --up: #02c076; --down: #f84960; --yellow: #fcd535; --gray: #848e9c; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; transition: background 0.1s; }
        #left-panel { width: 320px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #12161c; }
        .panel-header { padding: 20px; background: #181a20; border-bottom: 1px solid var(--line); }
        .live-price-big { font-size: 28px; font-weight: 800; font-family: 'Roboto Mono'; margin: 5px 0; transition: color 0.2s; }
        .stat-card { padding: 15px 20px; border-bottom: 1px solid var(--line); }
        .stat-label { color: var(--gray); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-family: 'Roboto Mono'; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        .fg-panel-bottom { background: #181a20; padding: 20px 15px; border-top: 1px solid var(--line); margin-top: auto; text-align: center; }
        .gauge-container { position: relative; width: 180px; height: 95px; margin: 0 auto; overflow: hidden; }
        .gauge-base { position: absolute; top: 0; left: 0; width: 180px; height: 180px; border-radius: 50%; background: #2b3139; }
        .gauge-arc { position: absolute; top: 0; left: 0; width: 180px; height: 180px; border-radius: 50%; background: conic-gradient(from 270deg, #f84960 0deg, #fcd535 90deg, #02c076 180deg, transparent 180deg); transition: 1.5s ease-in-out; }
        .gauge-center { position: absolute; top: 15px; left: 15px; width: 150px; height: 150px; background: #12161c; border-radius: 50%; display: flex; flex-direction: column; align-items: center; padding-top: 20px; z-index: 4; }
        #fg-value-display { font-size: 32px; font-weight: 900; color: white; font-family: 'Roboto Mono'; }
        #fg-status-text { font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .gauge-needle { position: absolute; bottom: 0; left: 50%; width: 3px; height: 75px; background: #fff; transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg); transition: transform 2s cubic-bezier(0.17, 0.67, 0.83, 0.67); z-index: 5; }
        #chart-zone { flex: 1; border-right: 1px solid var(--line); }
        #aggr-sidebar { width: 380px; display: flex; flex-direction: column; background: #12161c; }
        .panel-control { padding: 15px; background: #181a20; border-bottom: 1px solid var(--line); position: relative; }
        input { width: 100%; background: #2b3139; border: 1px solid #474d57; color: white; padding: 10px; border-radius: 4px; outline: none; box-sizing: border-box; font-size: 13px; }
        .limit-box { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .limit-box label { font-size: 10px; color: var(--yellow); white-space: nowrap; font-weight: bold; }
        #trade-feed { flex: 1; overflow-y: hidden; font-family: 'Roboto Mono'; font-size: 11px; }
        .trade-entry { display: flex; justify-content: space-between; padding: 6px 15px; border-bottom: 1px solid #1e2329; align-items: center; }
        .whale-row { background: rgba(252, 213, 53, 0.15) !important; border-left: 4px solid var(--yellow); animation: highlight 1s ease; }
        @keyframes highlight { from { background: rgba(255, 255, 255, 0.3); } to { background: rgba(252, 213, 53, 0.15); } }
        .volume-monitor { padding: 15px; background: #181a20; border-top: 1px solid var(--line); position: relative; }
        #mute-btn { position: absolute; right: 15px; top: -45px; background: #2b3139; border: 1px solid var(--line); color: var(--yellow); border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 10; }
        .vol-bar-container { height: 8px; background: #2b3139; border-radius: 4px; overflow: hidden; display: flex; margin: 10px 0; }
        #search-results { position: absolute; top: 115px; left: 15px; right: 15px; background: #2b3139; border: 1px solid var(--line); z-index: 1000; display: none; }
        .result-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #363c45; }
        .result-item:hover { background: #474d57; color: var(--yellow); }
        .season-container { padding: 15px 20px; border-bottom: 1px solid var(--line); }
        .season-bar-bg { height: 6px; background: #2b3139; border-radius: 3px; overflow: hidden; display: flex; margin-top: 8px; }
        #season-progress { height: 100%; width: 50%; background: linear-gradient(90deg, #fcd535, #ff8c00, #02c076); transition: 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        /* Watchlist Styling */
        #listing-panel { padding: 15px 20px; border-bottom: 1px solid var(--line); flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .listing-item { background: #181a20; padding: 10px; border-radius: 4px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--yellow); transition: 0.3s; }
        .listing-item.released { border-left-color: #474d57; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div class="panel-header">
            <div id="coin-name" style="color: var(--yellow); font-weight: bold;">BTC / USDT</div>
            <div id="live-price" class="live-price-big">$0.00</div>
            <div id="price-change" style="font-size: 13px;">0.00%</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-label">Market Cap (Live)</div>
            <div class="stat-value" id="live-mkt-cap">$ --</div>
            <div class="stat-label">Vol 24h (Sync)</div>
            <div class="stat-value" id="live-vol-24h" style="color: var(--yellow);">$ --</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Trades Count</div>
            <div id="live-count-24h" class="stat-value" style="color: #00d2ff;">0</div>
            <div class="stat-label">Circ. Supply</div>
            <div id="disp-circ" class="stat-value" style="font-size: 12px; color: var(--gray);">--</div>
        </div>

        <div class="season-container">
            <div class="stat-label">Market Season Index</div>
            <div id="season-text" style="font-size: 14px; font-weight: 800; color: #fff;">ANALYZING...</div>
            <div class="season-bar-bg">
                <div id="season-progress"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--gray); margin-top: 5px;">
                <span>BTC SEASON</span>
                <span>ALT SEASON</span>
            </div>
        </div>

        <div id="listing-panel">
            <div class="stat-label" style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span>Upcoming Listings</span>
                <button onclick="addCoinPrompt()" style="background: var(--line); border: none; color: var(--yellow); cursor: pointer; border-radius: 3px; font-size: 9px; padding: 2px 6px;">+ ADD</button>
            </div>
            <div id="watchlist-container"></div>
        </div>

        <div class="fg-panel-bottom">
            <div class="stat-label" style="margin-bottom: 10px;">Market Sentiment</div>
            <div class="gauge-container">
                <div class="gauge-base">
                    <div class="gauge-arc" id="fg-arc"></div>
                    <div class="gauge-center">
                        <div id="fg-value-display">--</div>
                        <div id="fg-status-text">LOADING</div>
                    </div>
                </div>
                <div class="gauge-needle" id="fg-needle"></div>
            </div>
        </div>
    </div>

    <div id="chart-zone"><div id="tv_engine" style="height: 100%;"></div></div>

    <div id="aggr-sidebar">
        <div class="panel-control">
            <input type="text" id="coin-search" placeholder="Search (e.g. SOLUSDT)...">
            <div class="limit-box">
                <label>WHALE LIMIT ($)</label>
                <input type="number" id="whale-input" value="50000">
            </div>
            <div id="search-results"></div>
        </div>
        
        <div id="trade-feed"></div>
        
        <div class="volume-monitor">
            <button id="mute-btn" title="Toggle Sound">🔊</button>
            <div style="font-size: 10px; color: var(--gray); text-align: center; margin-bottom: 5px;">MOMENTUM ALERT (50 TRADES)</div>
            <div class="vol-bar-container">
                <div id="buy-bar" style="width: 50%; background: var(--up); transition: 0.5s;"></div>
                <div id="sell-bar" style="width: 50%; background: var(--down); transition: 0.5s;"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold;">
                <span id="buy-pct" style="color: var(--up)">50%</span>
                <span id="sell-pct" style="color: var(--down)">50%</span>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const whaleSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
        let isMuted = false;
        let tradeWS, allSymbols = [], tradeHistory = [];
        let baseVol = 0, baseCount = 0, circSupply = 0, lastP = 0;

        // --- WATCHLIST & AUTO-TOKENOMIC LOGIC ---
        let upcomingCoins = JSON.parse(localStorage.getItem('myWatchlist')) || [];
        const tokenomicsDB = {
            "MYX": "2026-02-07T23:30:00",
            "MONAD": "2026-02-15T15:00:00",
            "ZAMA": "2026-02-10T10:00:00"
        };

        function addCoinPrompt() {
            const name = prompt("Ketik Nama Koin (Contoh: MYX):").toUpperCase();
            if(!name) return;
            let time;
            if(tokenomicsDB[name]) {
                time = tokenomicsDB[name];
                alert(name + " terdeteksi! Mengambil data otomatis...");
            } else {
                const manual = prompt("Data tidak ada. Masukkan waktu (YYYY-MM-DD HH:MM:SS):", "2026-02-08 20:00:00");
                if(!manual) return;
                time = manual.replace(" ", "T");
            }
            upcomingCoins.push({ name, time });
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myWatchlist', JSON.stringify(upcomingCoins));
            renderWatchlist();
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlist-container');
            const now = new Date().getTime();
            upcomingCoins.sort((a, b) => new Date(a.time).getTime() - new Date(b.time).getTime());
            container.innerHTML = '';
            upcomingCoins.forEach((c, i) => {
                const diff = new Date(c.time).getTime() - now;
                const isReleased = diff <= 0;
                let tStr = "LIVE NOW";
                if(!isReleased) {
                    const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
                    tStr = `${d}d ${h}h ${m}m ${s}s`;
                }
                container.innerHTML += `
                    <div class="listing-item ${isReleased ? 'released' : ''}">
                        <div><b style="font-size:13px">${c.name}</b><div style="font-size:8px; color:var(--gray)">${c.time.split('T')[0]}</div></div>
                        <div style="text-align:right">
                            <div style="font-family:'Roboto Mono'; font-size:11px; color:${isReleased ? 'var(--up)' : 'var(--yellow)'}">${tStr}</div>
                            <span onclick="delCoin(${i})" style="color:var(--down); font-size:9px; cursor:pointer">DEL</span>
                        </div>
                    </div>`;
            });
        }
        function delCoin(i) { upcomingCoins.splice(i, 1); saveAndRender(); }
        setInterval(renderWatchlist, 1000);

        // --- EXISTING LOGIC ---
        const coinMap = { 'BTC': 'bitcoin', 'ETH': 'ethereum', 'SOL': 'solana', 'BNB': 'binancecoin', 'XRP': 'ripple', 'ADA': 'cardano', 'DOGE': 'dogecoin' };
        const savedLimit = localStorage.getItem('whaleLimit');
        if (savedLimit) document.getElementById('whale-input').value = savedLimit;
        document.getElementById('whale-input').onchange = (e) => localStorage.setItem('whaleLimit', e.target.value);
        document.getElementById('mute-btn').onclick = function() { isMuted = !isMuted; this.innerText = isMuted ? '🔇' : '🔊'; };

        async function updateMarketSeason() {
            try {
                const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT","ADAUSDT","DOGEUSDT"];
                const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${JSON.stringify(symbols)}`);
                const data = await res.json();
                const btc = data.find(x => x.symbol === "BTCUSDT");
                const btcChange = parseFloat(btc.priceChangePercent);
                const alts = data.filter(x => x.symbol !== "BTCUSDT");
                const altsAvgChange = alts.reduce((acc, curr) => acc + parseFloat(curr.priceChangePercent), 0) / alts.length;
                let score = 50 + ((altsAvgChange - btcChange) * 5); 
                score = Math.min(Math.max(score, 5), 95);
                document.getElementById('season-progress').style.width = score + '%';
                const textEl = document.getElementById('season-text');
                if (score > 60) { textEl.innerText = "ALTCOIN SEASON"; textEl.style.color = "var(--up)"; }
                else if (score < 40) { textEl.innerText = "BITCOIN SEASON"; textEl.style.color = "var(--yellow)"; }
                else { textEl.innerText = "NEUTRAL MOMENTUM"; textEl.style.color = "#fff"; }
            } catch (e) {}
        }

        async function fetchFund(s) {
            try {
                const ticker = s.replace('USDT', '');
                const id = coinMap[ticker] || ticker.toLowerCase();
                const res = await fetch(`https://api.coingecko.com/api/v3/coins/${id}`);
                const d = await res.json();
                if(d.market_data) {
                    circSupply = d.market_data.circulating_supply;
                    document.getElementById('disp-circ').innerText = Math.round(circSupply).toLocaleString();
                    if(lastP > 0) document.getElementById('live-mkt-cap').innerText = `$${Math.round(lastP * circSupply).toLocaleString()}`;
                }
            } catch(e) { document.getElementById('disp-circ').innerText = "Data N/A"; }
        }

        async function startLive(symbol) {
            if (tradeWS) tradeWS.close();
            tradeHistory = [];
            try {
                const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                const d = await res.json();
                baseVol = parseFloat(d.quoteVolume); baseCount = parseInt(d.count); lastP = parseFloat(d.lastPrice);
                document.getElementById('price-change').innerText = `${parseFloat(d.priceChangePercent).toFixed(2)}%`;
                document.getElementById('price-change').style.color = d.priceChangePercent >= 0 ? 'var(--up)' : 'var(--down)';
            } catch(e) {}
            fetchFund(symbol);
            tradeWS = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@aggTrade`);
            tradeWS.onmessage = (e) => {
                const data = JSON.parse(e.data);
                const p = parseFloat(data.p), v = p * parseFloat(data.q), limit = parseFloat(document.getElementById('whale-input').value) || 50000;
                const pEl = document.getElementById('live-price');
                pEl.style.color = p >= lastP ? 'var(--up)' : 'var(--down)';
                pEl.innerText = `$${p.toLocaleString()}`;
                if(circSupply > 0) document.getElementById('live-mkt-cap').innerText = `$${Math.round(p * circSupply).toLocaleString()}`;
                baseVol += v; baseCount++;
                document.getElementById('live-vol-24h').innerText = `$${Math.round(baseVol).toLocaleString()}`;
                document.getElementById('live-count-24h').innerText = baseCount.toLocaleString();
                let isWhale = v >= limit;
                if (isWhale) {
                    if(!isMuted) { whaleSound.currentTime = 0; whaleSound.play().catch(()=>{}); }
                    document.body.style.backgroundColor = "#1c1c1c";
                    setTimeout(() => document.body.style.backgroundColor = "#0b0e11", 150);
                }
                tradeHistory.push({v, s: data.m});
                if(tradeHistory.length > 50) tradeHistory.shift();
                let bv=0, sv=0; tradeHistory.forEach(t=> t.s ? sv+=t.v : bv+=t.v);
                const total = bv+sv;
                document.getElementById('buy-bar').style.width = (bv/total*100)+'%';
                document.getElementById('buy-pct').innerText = Math.round(bv/total*100)+'%';
                document.getElementById('sell-pct').innerText = Math.round(sv/total*100)+'%';
                const row = `<div class="trade-entry ${isWhale ? 'whale-row' : ''}">
                    <span>${isWhale ? '🐋 WHALE' : new Date().toLocaleTimeString([], {hour12:false})}</span>
                    <span style="color:${data.m ? 'var(--down)' : 'var(--up)'}; font-weight:bold">${p.toFixed(symbol.includes('BTC') ? 2 : 4)}</span>
                    <b style="${isWhale ? 'color:var(--yellow)' : ''}">$${Math.round(v).toLocaleString()}</b>
                </div>`;
                const f = document.getElementById('trade-feed');
                f.insertAdjacentHTML('afterbegin', row);
                if (f.childNodes.length > 40) f.lastChild.remove();
                lastP = p;
            };
        }

        async function refreshFearGreedGauge() {
            try {
                const response = await fetch('https://api.alternative.me/fng/');
                const json = await response.json();
                const value = parseInt(json.data[0].value);
                document.getElementById('fg-value-display').innerText = value;
                document.getElementById('fg-status-text').innerText = json.data[0].value_classification.toUpperCase();
                document.getElementById('fg-needle').style.transform = `translateX(-50%) rotate(${(value * 1.8) - 90}deg)`;
            } catch (err) {}
        }

        function loadChart(s) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:"+s, "interval": "1", "theme": "dark", "container_id": "tv_engine", "timezone": "Asia/Jakarta", "hide_side_toolbar": false, "allow_symbol_change": true, "save_image": false
            });
        }

        fetch('https://api.binance.com/api/v3/exchangeInfo').then(r=>r.json()).then(d=>{
            allSymbols = d.symbols.filter(s=>s.quoteAsset==='USDT').map(s=>s.symbol);
        });

        document.getElementById('coin-search').addEventListener('input', (e)=>{
            const v = e.target.value.toUpperCase();
            const res = document.getElementById('search-results');
            res.innerHTML = '';
            if(v){
                res.style.display='block';
                allSymbols.filter(s=>s.includes(v)).slice(0,10).forEach(m=>{
                    const i = document.createElement('div'); i.className='result-item'; i.innerText=m;
                    i.onclick = () => { loadChart(m); startLive(m); res.style.display='none'; e.target.value=''; document.getElementById('coin-name').innerText = m + ' / USDT'; };
                    res.appendChild(i);
                });
            } else res.style.display='none';
        });

        loadChart('BTCUSDT'); startLive('BTCUSDT'); refreshFearGreedGauge(); updateMarketSeason(); renderWatchlist();
        setInterval(refreshFearGreedGauge, 300000); setInterval(updateMarketSeason, 60000);
    </script>
</body>
</html>
