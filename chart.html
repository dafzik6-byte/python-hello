<!DOCTYPE html>
<html>
<head>
    <title>Pro Terminal: Sync Volume & Search</title>
    <style>
        :root { --bg: #0b0e11; --line: #2b2f36; --up: #02c076; --down: #f84960; --yellow: #fcd535; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: #eaecef; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #chart-zone { flex: 1; border-right: 1px solid var(--line); position: relative; }
        #aggr-sidebar { width: 400px; display: flex; flex-direction: column; background: var(--bg); }
        
        .panel-control { padding: 15px; background: #181a20; border-bottom: 1px solid var(--line); position: relative; }
        input { width: 100%; background: #2b2f36; border: 1px solid #474d57; color: white; padding: 12px; border-radius: 4px; box-sizing: border-box; outline: none; font-size: 14px; }
        input:focus { border-color: var(--yellow); }

        #search-results { 
            position: absolute; top: 65px; left: 15px; right: 15px; 
            background: #2b3139; border: 1px solid var(--line); border-radius: 4px; 
            max-height: 300px; overflow-y: auto; z-index: 1000; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .result-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #363c45; display: flex; justify-content: space-between; }
        .result-item:hover { background: #474d57; color: var(--yellow); }

        .volume-monitor { padding: 15px; background: #181a20; border-top: 1px solid var(--line); }
        .vol-label { font-size: 11px; color: #848e9c; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        .vol-bar-container { height: 14px; background: #2b3139; border-radius: 7px; overflow: hidden; display: flex; margin-bottom: 5px; border: 1px solid #363c45; }
        #buy-bar { height: 100%; background: var(--up); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        #sell-bar { height: 100%; background: var(--down); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .vol-stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; font-family: 'Roboto Mono', monospace; }

        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #trade-feed { flex: 1; overflow-y: hidden; font-family: 'Roboto Mono', monospace; font-size: 11px; }
        .trade-entry { display: flex; justify-content: space-between; padding: 7px 15px; border-bottom: 1px solid #1e2329; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="chart-zone"><div id="tv_engine" style="height: 100%;"></div></div>

    <div id="aggr-sidebar">
        <div class="panel-control">
            <input type="text" id="coin-search" placeholder="Cari Koin di Binance..." autocomplete="off">
            <div id="search-results"></div>
        </div>

        <div id="main-content">
            <div style="font-size: 10px; color: #848e9c; padding: 10px 15px; display: flex; justify-content: space-between; background: #181a20; font-weight: bold; border-bottom: 1px solid var(--line);">
                <span>TIME</span>
                <span id="target-title" style="color: var(--yellow)">---</span>
                <span>PRICE / VALUE</span>
            </div>
            <div id="trade-feed"></div>
        </div>

        <div class="volume-monitor">
            <div class="vol-label">
                <span id="vol-symbol-label">BTCUSDT 24H RATIO</span>
                <span id="vol-total" style="color: white;">$0</span>
            </div>
            <div class="vol-bar-container">
                <div id="buy-bar" style="width: 50%;"></div>
                <div id="sell-bar" style="width: 50%;"></div>
            </div>
            <div class="vol-stats">
                <span id="buy-pct" style="color: var(--up)">50% BUY</span>
                <span id="sell-pct" style="color: var(--down)">50% SELL</span>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tradeWS;
        let currentSymbol = 'BTCUSDT';
        let allSymbols = [];

        async function getBinanceList() {
            try {
                const r = await fetch('https://api.binance.com/api/v3/exchangeInfo');
                const data = await r.json();
                allSymbols = data.symbols.filter(s => s.status === 'TRADING' && s.quoteAsset === 'USDT').map(s => s.symbol);
            } catch (e) { console.error("API Error"); }
        }

        async function fetchVolumeData(symbol) {
            try {
                const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`);
                const data = await response.json();
                
                // Kalkulasi Ratio berdasarkan sentimen harga 24 jam
                const change = parseFloat(data.priceChangePercent);
                let buyRatio = 50 + (change * 1.5); 
                buyRatio = Math.min(Math.max(buyRatio, 10), 90); // Lock antara 10%-90%
                let sellRatio = 100 - buyRatio;

                // Update UI Volume Bar
                document.getElementById('vol-symbol-label').innerText = `${symbol} 24H RATIO`;
                document.getElementById('buy-bar').style.width = buyRatio + '%';
                document.getElementById('sell-bar').style.width = sellRatio + '%';
                document.getElementById('buy-pct').innerText = buyRatio.toFixed(1) + '% BUY';
                document.getElementById('sell-pct').innerText = sellRatio.toFixed(1) + '% SELL';
                document.getElementById('vol-total').innerText = 'Vol: $' + Math.round(data.quoteVolume).toLocaleString();
            } catch (e) { console.log("Volume update failed"); }
        }

        function loadChart(symbol) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + symbol, "interval": "1", "theme": "dark",
                "container_id": "tv_engine", "hide_side_toolbar": false, "allow_symbol_change": true,
                "header_indicators": true, "header_settings": true, "enabled_features": ["header_widget"]
            });
        }

        function startLiveTrade(symbol) {
            if (tradeWS) tradeWS.close();
            currentSymbol = symbol;
            document.getElementById('target-title').innerText = symbol;
            document.getElementById('trade-feed').innerHTML = '';
            
            // PENTING: Update Volume Bar segera saat ganti koin
            fetchVolumeData(symbol);

            tradeWS = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@aggTrade`);
            tradeWS.onmessage = (e) => {
                const d = JSON.parse(e.data);
                const price = parseFloat(d.p);
                const val = price * d.q;
                const row = document.createElement('div');
                row.className = 'trade-entry';
                if (val > 10000) row.style.fontWeight = 'bold';
                row.innerHTML = `
                    <span style="color:#848e9c">${new Date(d.E).toLocaleTimeString()}</span>
                    <span style="color:${d.m ? 'var(--down)' : 'var(--up)'}">${price.toLocaleString()}</span>
                    <span>$${Math.round(val).toLocaleString()}</span>
                `;
                const feed = document.getElementById('trade-feed');
                feed.insertBefore(row, feed.firstChild);
                if (feed.childNodes.length > 40) feed.removeChild(feed.lastChild);
            };
        }

        // Search Engine Logic
        const input = document.getElementById('coin-search');
        const results = document.getElementById('search-results');

        input.addEventListener('input', () => {
            const val = input.value.toUpperCase();
            results.innerHTML = '';
            if (val) {
                const matches = allSymbols.filter(s => s.includes(val)).slice(0, 10);
                results.style.display = 'block';
                matches.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `<span>${m}</span><small style="color:var(--yellow)">Trade Now</small>`;
                    item.onclick = () => {
                        loadChart(m);
                        startLiveTrade(m); // Ini akan memicu fetchVolumeData(m)
                        results.style.display = 'none';
                        input.value = '';
                    };
                    results.appendChild(item);
                });
            } else { results.style.display = 'none'; }
        });

        // Init
        getBinanceList();
        loadChart('BTCUSDT');
        startLiveTrade('BTCUSDT');
        
        // Auto refresh volume bar setiap 20 detik untuk koin yang sedang aktif
        setInterval(() => fetchVolumeData(currentSymbol), 20000);
    </script>
</body>
</html>
