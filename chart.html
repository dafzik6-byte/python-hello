<!DOCTYPE html>
<html>
<head>
    <title>Binance Terminal Pro</title>
    <style>
        /* Hilangkan semua margin dan padding */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100vh; /* Kunci tinggi ke 100% layar */
            background-color: #131722; 
            overflow: hidden; 
        }

        /* Pastikan pembungkusnya juga 100% layar */
        .tradingview-widget-container { 
            width: 100%; 
            height: 100vh; 
        }

        #tradingview_pro {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="tradingview-widget-container">
        <div id="tradingview_pro"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
        new TradingView.widget(
        {
            "width": "100%",        // Paksa lebar 100%
            "height": "100%",       // Paksa tinggi 100%
            "symbol": "BINANCE:BTCUSDT",
            "interval": "1",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_pro"
        }
        );
        </script>
    </div>

</body>
</html>
